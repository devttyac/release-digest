# One-shot job, not a service. `docker compose up` runs it once and exits —
# there is no inbound port, so this never needs to sit behind the reverse proxy.
#
# Scheduling is deliberately left to the host (systemd timer or cron; see
# deploy/). A once-a-month job does not justify a container idling all year,
# and a host timer survives container restarts and catches up missed runs.
services:
  release-digest:
    build: .
    image: release-digest:latest
    container_name: release-digest
    env_file:
      - .env
    environment:
      TZ: Asia/Singapore
      # DIGEST_MONTH: "2026-11"   # target a specific month instead of the current one
      # DRY_RUN: "1"              # build the message without sending
      ARCHIVE_DIR: /archive
    volumes:
      - ./archive:/archive
    restart: "no"
